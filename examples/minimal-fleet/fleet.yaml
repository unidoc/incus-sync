# Identifies this fleet. Required — also names its secret vault
# (~/.config/incus-sync/minimal-fleet/), so no two fleets ever share a
# vault passphrase or ssh-agent-derived key. See internal/vault's
# package doc, and README.md's "Auth" section.
name: minimal-fleet

# Declares every Incus project this fleet manages. Required — no
# fallback. See docs/schema.md.
projects:
  - default

# Where network ACLs + address-sets physically live in Incus. "default"
# is correct for almost every setup (see fleet.yaml's field docs in
# internal/config/fleet_meta.go) — only change this if you've set
# features.networks=true on a non-default project.
network_project: default
