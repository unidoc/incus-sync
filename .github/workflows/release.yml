name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag push has no relation to the test workflow (that only triggers
  # on push:branches/pull_request) — without this gate, goreleaser
  # would publish from a tagged commit whose tests never ran, or
  # failed. `just release` checks version.txt/clean-tree/tag-existence
  # but not CI status, so this has to hold regardless of how the tag
  # was created.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
